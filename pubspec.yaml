name: pixshift
description: PixShift - free image tools (89 tools) as a native Android app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  archive: ^3.6.1
  image: ^4.2.0
  flutter_image_compress: ^2.3.0
  gal: ^2.3.0
  flutter_svg: ^2.0.10+1
  vector_graphics: ^1.1.11+1
  flutter_avif: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
